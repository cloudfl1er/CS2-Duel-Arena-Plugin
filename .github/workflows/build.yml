name: Build CS2 Duel Arena Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CS2DuelServer.csproj

      - name: Build
        run: dotnet build CS2DuelServer.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CS2DuelServer.csproj --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2DuelServer
          path: ./publish/CS2DuelServer.dll
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        permissions:
          contents: write
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./publish/CS2DuelServer.dll
          asset_name: CS2DuelServer.dll
          asset_content_type: application/octet-stream
